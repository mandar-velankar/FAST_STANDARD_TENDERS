specVersion: '1.0'
metadata:
  name: 'statenderapp'
type: application
ui5Theme: sap_fiori_3
server:
  settings:
    httpPort: 8089
  customMiddleware:
  - name: fiori-tools-proxy
    afterMiddleware: compression
    configuration:
      ignoreCertError: false # If set to true, certificate errors will be ignored. E.g. self-signed certificates will be accepted
      backend:
      - path: /UITemplates
        url: http://localhost:4005/
      - path: /v2
        url: http://localhost:4004
      ui5:
        path: 
        - /resources
        - /test-resources
        url: https://ui5.sap.com
        version:  # The UI5 version, for instance, 1.78.1. Empty means latest version
  - name: fiori-tools-servestatic
    afterMiddleware: compression
    configuration:
      paths:
        - path: /GenericTableComponent
          src:  ../F_TNDR_CAG_FAST_UI_TEMPLATES/app/GenericTableComponent/dist
        - path: /GenericFormComponent
          src: ../F_TNDR_CAG_FAST_UI_TEMPLATES/app/GenericFormComponent/dist
        - path: /GenericSingleFormComponent
          src: ../F_TNDR_CAG_FAST_UI_TEMPLATES/app/GenericSingleFormComponent/dist
  - name: fiori-tools-appreload
    afterMiddleware: compression
    configuration:
     port: 35729
     path: webapp
