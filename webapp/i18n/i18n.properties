# This is the resource bundle for FAST standard tender application

#XTIT: Application name
appTitle=FAST standard tender application

#YDES: Application description
appDescription=Standard application for FAST tender framework

#~~~ Master View ~~~~~~~~~~~~~~~~~~~~~~~~~~

#XTIT: Master view title with placeholder for the number of items
masterTitleCount=<PT_TMTEND> ({0})

#XTOL: Tooltip for the search field
masterSearchTooltip=Enter an <PT_TMTEND> name or a part of it.

#XBLI: text for a list with no data
masterListNoDataText=No <PT_TMTENDPlural> are currently available

#XBLI: text for a list with no data with filter or search
masterListNoDataWithFilterOrSearchText=No matching <PT_TMTENDPlural> found

#XSEL: Option to sort the master list by TenderName
masterSort1=Sort By <TenderName>

#XSEL: Option to sort the master list by TenderNo
masterSort2=Sort By <TenderNo>

#XSEL: Option to filter the master list by TenderNo
masterFilterName=<TenderNo>

#XSEL: Option to not filter the master list
masterFilterNone=none


#XSEL: Option to filter the master list by BidDueDate if the value is less than 100
masterFilter1=<100 <BidDueDate>

#XSEL: Option to filter the master list by BidDueDate if the value is greater than 100
masterFilter2=>100 <BidDueDate>

#YMSG: Filter text that is displayed above the master list
masterFilterBarText=Filtered by {0}

#XSEL: Option to not group the master list
masterGroupNone=(Not grouped)

#XSEL: Option to group the master list by TenderNo
masterGroup1=<TenderNo> Group

#XGRP: Group header TenderNo
masterGroup1Header1=<TenderNo> 20 or less

#XGRP: Group header TenderNo
masterGroup1Header2=<TenderNo> higher than 20

#~~~ Detail View ~~~~~~~~~~~~~~~~~~~~~~~~~~

#XTOL: Icon Tab Bar Info
detailIconTabBarInfo=Info

#XTOL: Icon Tab Bar Attachments
detailIconTabBarAttachments=Attachments

#XTOL: Tooltip text for close column button
closeColumn=Close

#XBLI: Text for the Offer table with no data
detailLineItemTableNoDataText=No <OfferPlural>

#XTIT: Title of the Offer table
detailLineItemTableHeading=<OfferPlural>

#XTIT: Title of the Offer table
detailLineItemTableHeadingCount=<OfferPlural> ({0})

#XGRP: Title for the OfferID column in the Offer table
detailLineItemTableIDColumn=<FirstColumnName>

#XGRP: Title for the ContinuationOfferNo column in the Offer table
detailLineItemTableUnitNumberColumn=<LastColumnName>

#XTIT: Send E-Mail subject
shareSendEmailObjectSubject=<Email subject including object identifier PLEASE REPLACE ACCORDING TO YOUR USE CASE> {0}

#YMSG: Send E-Mail message
shareSendEmailObjectMessage=<Email body PLEASE REPLACE ACCORDING TO YOUR USE CASE> {0} (id: {1})\r\n{2}

#XBUT: Text for the send e-mail button
sendEmail=Send E-Mail

#XTIT: Title text for the price
priceTitle=Price

#~~~ Not Found View ~~~~~~~~~~~~~~~~~~~~~~~

#XTIT: Not found view title
notFoundTitle=Not Found

#YMSG: The PT_TMTEND not found text is displayed when there is no PT_TMTEND with this id
noObjectFoundText=This <PT_TMTEND> is not available

#YMSG: The not found text is displayed when there was an error loading the resource (404 error)
notFoundText=The requested resource was not found

#~~~ Not Available View ~~~~~~~~~~~~~~~~~~~~~~~

#XTIT: Master view title
notAvailableViewTitle=<PT_TMTEND>

#~~~ Error Handling ~~~~~~~~~~~~~~~~~~~~~~~

#YMSG: Error dialog description
errorText=Sorry, a technical error occurred! Please try again later.

